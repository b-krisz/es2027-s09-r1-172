<nav class="max-w-2xs
            m-auto mt-10
            rounded-3xl
            bg-stone-400 dark:bg-blue-950">
  <input id="searchTerm" class="w-full p-5 rounded-3xl" type="text" placeholder="Search..." [formControl]="searchTerm">
</nav>
<main class="max-w-[640px]
             max-h-[640px]
             m-auto mt-10
             p-5
             sm:rounded-3xl
             bg-stone-400 dark:bg-blue-950
             flex flex-col items-center
             text-sm sm:text-lg
             overflow-x-hidden
             overflow-y-scroll">
  @for (project of projects; track project.id)
  {
    <div class="w-full
              m-3 p-3
              border rounded-xl
            border-stone-950 dark:border-stone-400
              flex flex-row justify-between">
      <h2 class="font-bold m-2">{{project.name}}</h2>
      <h2 class="italic m-2 overflow-hidden whitespace-nowrap text-ellipsis">{{project.id}}</h2>
    </div>
  }
  @empty {
    <h2>No results...</h2>
  }
</main>
