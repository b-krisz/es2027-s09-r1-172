<nav class="max-w-2xs
            m-auto
            rounded-b-2xl
            bg-stone-400 dark:bg-blue-950">
  <input id="searchTerm"
         class="w-full p-5 rounded-b-3xl"
         type="text" placeholder="Search..." [formControl]="searchTerm">
</nav>
<main class="max-w-[640px]
             max-h-[640px]
             m-auto mt-10
             p-5
             sm:rounded-3xl
             bg-stone-400 dark:bg-blue-950
             flex flex-col items-center
             text-sm sm:text-lg
             overflow-x-hidden
             overflow-y-scroll">
  @for (project of projects; track project.id)
  {
    <app-project-component class="w-full"
      [name]="project.name" [id]="project.id" [routerLink]="['project', project.id]"/>
  }
  @empty {
    <h2>No results...</h2>
  }
</main>
